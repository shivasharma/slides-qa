<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapter 11 Study Assistant</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root {
  --bg-color: #212121;
  --text-color: #ececec;
  --ai-bubble: #2f2f2f;
  --user-bubble: #3c3c3c;
  --accent: #10a37f;
  --input-bg: #2f2f2f;
}
body {
  background: var(--bg-color);
  color: var(--text-color);
  font-family: 'Inter', sans-serif;
  margin: 0;
  display: flex;
  flex-direction: column;
  height: 100vh;
}
#chatBox { flex:1; overflow-y:auto; padding:2rem; display:flex; flex-direction:column; gap:1.5rem; scroll-behavior:smooth; }
.message { max-width:80%; padding:0.8rem 1.2rem; border-radius:1rem; line-height:1.6; word-wrap:break-word; animation:fadeIn 0.3s ease; }
.user-message { align-self:flex-end; background:var(--user-bubble); border-bottom-right-radius:0.2rem; }
.ai-message { align-self:flex-start; background:var(--ai-bubble); border-bottom-left-radius:0.2rem; border-left:3px solid var(--accent); }
.ai-message p { margin:0; }
.ai-message code { background:#000; padding:2px 4px; border-radius:4px; color:#ffadad; }
.input-area { padding:1.5rem; display:flex; justify-content:center; background: linear-gradient(transparent, var(--bg-color) 40%);}
.input-wrapper { width:100%; max-width:800px; }
#userInput { width:100%; background:var(--input-bg); border:1px solid #565869; color:white; padding:1.2rem; border-radius:0.75rem; outline:none; font-size:1rem; }
#userInput:focus { border-color: var(--accent); }
@keyframes fadeIn { from {opacity:0; transform:translateY(10px);} to {opacity:1; transform:translateY(0);} }
</style>
</head>
<body>

<div id="chatBox">
  <div class="message ai-message">Hello! Ask me anything about the Chapter 11 Java slides.</div>
</div>

<div class="input-area">
  <div class="input-wrapper">
    <input type="text" id="userInput" placeholder="Type your question and press Enter..." autocomplete="off">
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const chatBox = document.getElementById('chatBox');
  const userInput = document.getElementById('userInput');

  function appendMessage(text, className) {
    const div = document.createElement('div');
    div.className = `message ${className}`;
    div.innerHTML = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
    return div;
  }

  async function askQuestion() {
    const question = userInput.value.trim();
    if (!question) return;

    appendMessage(question, 'user-message');
    userInput.value = '';

    const aiMessageDiv = appendMessage('...', 'ai-message');
    let fullText = "";

    try {
      const slideUrl = "https://shivaprogramming.com/IS247/slides/chap11.html";
      const response = await fetch(
        `/answer?q=${encodeURIComponent(question)}&url=${encodeURIComponent(slideUrl)}&topic=java`,
        { headers: { "ngrok-skip-browser-warning": "true" } }
      );

      if (!response.ok) throw new Error(`Server error: ${response.status}`);

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let firstChunk = true;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        const chunk = decoder.decode(value, { stream: true });

        if (firstChunk) {
          aiMessageDiv.innerHTML = "";
          firstChunk = false;
        }

        fullText += chunk;
        aiMessageDiv.innerHTML = marked.parse(fullText);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

    } catch (err) {
      console.error("Fetch error:", err);
      aiMessageDiv.innerText = "⚠️ Unable to reach AI server.";
    }
  }

  userInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') askQuestion();
  });
});
</script>

</body>
</html>
